# Publie une version du module : module.json (version et adresses mises à jour) et tableau-de-jeu.zip
# attachés à la release GitHub. Déclenché par une étiquette vX.Y.Z poussée, ou par une release publiée depuis
# l'interface de GitHub (Releases > Draft a new release > étiquette vX.Y.Z).
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# Une release créée dans l'interface pousse aussi son étiquette : les deux déclenchements passent l'un après l'autre.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer module.json
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" '
            .version = $v
            | .url = $r
            | .bugs = ($r + "/issues")
            | .manifest = ($r + "/releases/latest/download/module.json")
            | .download = ($r + "/releases/download/v" + $v + "/tableau-de-jeu.zip")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Archive
        run: zip -r tableau-de-jeu.zip module.json scripts styles README.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            module.json
            tableau-de-jeu.zip
          generate_release_notes: true
          # Le manifeste installé dans Foundry pointe sur « latest » : chaque version publiée le devient.
          make_latest: true
